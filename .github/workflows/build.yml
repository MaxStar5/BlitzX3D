name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install required VS workloads (MFC/ATL v143)
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS install path: $vsPath"
          Start-Process -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" -ArgumentList `
            "modify", "--installPath", "`"$vsPath`"", `
            "--add", "Microsoft.VisualStudio.Component.VC.ATLMFC", `
            "--add", "Microsoft.VisualStudio.Component.VC.ATL", `
            "--quiet", "--norestart", "--wait" `
            -Wait -PassThru | Select-Object -ExpandProperty ExitCode

      - name: Install DirectX SDK (June 2010)
        shell: pwsh
        run: |
          # Work around S1023
          $vc2010x86 = "{F0C3E5D1-1ADE-321E-8167-68EF0DE699A5}"
          $vc2010x64 = "{1D8E6291-B0D5-35EC-8441-6616F567A0F7}"
      
          foreach ($guid in @($vc2010x86,$vc2010x64)) {
            Start-Process msiexec.exe -ArgumentList "/x $guid /quiet /norestart" -Wait -ErrorAction SilentlyContinue
          }
      
          $exe = "$env:TEMP\DXSDK_Jun10.exe"
          $extract = "$env:TEMP\DXSDK"
      
          Invoke-WebRequest `
            -Uri "https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe" `
            -OutFile $exe
      
          Remove-Item $extract -Recurse -Force -ErrorAction Ignore
          New-Item -ItemType Directory -Path $extract | Out-Null
      
          Start-Process $exe `
            -ArgumentList "/Q /T:$extract" `
            -Wait
      
          if (!(Test-Path "$extract\DXSETUP.exe")) {
            throw "DXSETUP.exe not extracted."
          }
      
          Start-Process "$extract\DXSETUP.exe" `
            -ArgumentList "/silent" `
            -Wait
      
          $dxsdkPath = "${env:ProgramFiles(x86)}\Microsoft DirectX SDK (June 2010)\"
      
          if (!(Test-Path "$dxsdkPath\Include\d3dx9.h")) {
            throw "DirectX SDK installation failed."
          }
      
          "DXSDK_DIR=$dxsdkPath" >> $env:GITHUB_ENV

      - name: Create cryptseed.h
        shell: pwsh
        run: |
          Copy-Item "linker\cryptseed.h.example" "linker\cryptseed.h"
          $seedHex = "0x{0:X8}u" -f (1000000000 + ${env:GITHUB_RUN_NUMBER})
          (Get-Content "linker\cryptseed.h") -replace 'RUNTIME_KEY_SEED = 0x[0-9A-Fa-f]+u', "RUNTIME_KEY_SEED = $seedHex" | Set-Content "linker\cryptseed.h"

      - name: Restore NuGet packages
        run: nuget restore blitz3d.sln
        continue-on-error: true

      - name: Build solution (Release)
        run: msbuild blitz3d.sln /p:Configuration=Release /m /v:minimal

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: blitz3d-release
          path: |
            _release/**
            !_release/**/*.pdb
            !_release/**/*.ilk
          if-no-files-found: warn
